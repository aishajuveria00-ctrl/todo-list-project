<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">STUDENT PRODUCTIVITY</p>
      <h1>My To-Do List</h1>
      <p class="subtitle">Plan your day, one task at a time.</p>
    </header>

    <form id="task-form" class="task-form">
      <label class="sr-only" for="task-input">New task</label>
      <input id="task-input" type="text" placeholder="e.g. Finish mathematics homework" maxlength="160" required>
      <button type="submit">Add task</button>
    </form>

    <section class="toolbar" aria-label="Task filters">
      <div class="filters">
        <button type="button" class="filter active" data-filter="all">All</button>
        <button type="button" class="filter" data-filter="pending">Pending</button>
        <button type="button" class="filter" data-filter="completed">Completed</button>
      </div>
      <span id="task-count" aria-live="polite">0 tasks</span>
    </section>

    <ul id="task-list" class="task-list"></ul>
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">✓</div>
      <h2>You're all caught up!</h2>
      <p>Add a task above to get started.</p>
    </div>

    <footer>
      <span id="remaining-count">0 tasks remaining</span>
      <button id="clear-completed" class="text-button" type="button">Clear completed</button>
    </footer>
    <p class="storage-note">Your tasks are saved in this browser on this device.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
